n class="btn btn-primary login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button></form></section></main>`;

      function navigation(){const admin=currentUser.role==='admin';const entries=admin?[['dashboard','▦','Overview'],['clients','◈','Clients'],['jobs','▤','Vacancies'],['students','♙','Candidates'],['applications','↗','Applications']]:[['jobs','▤','Explore jobs'],['applications','↗','My applications'],['profile','♙','My profile']];return `<aside class="sidebar"><div class="brand"><span class="brand-mark">F</span><div class="brand-name">Design Career<br>Connect<small>${admin?'AGENCY PORTAL':'STUDENT PORTAL'}</small></div></div><div class="nav-label">${admin?'Workspace':'Your journey'}</div><nav class="nav">${entries.map(([id,symbol,label])=>`<button class="${currentView===id?'active':''}" data-view="${id}">${icon(symbol)}<span>${label}</span></button>`).join('')}</nav><div class="side-bottom">${admin?`<div class="support"><strong>People first, always.</strong><p>Thoughtful hiring starts with a conversation.</p><button data-support>Contact support ↗</button></div>`:''}<div class="identity"><div class="avatar">${initials(currentUser.name)}</div><div class="identity-text"><b>${esc(currentUser.name)}</b><span>${esc(currentUser.email)}</span></div><button class="logout" title="Sign out" aria-label="Sign out" data-logout>↪</button></div></div></aside>`}

      function appTableRows(applications,admin=false){if(!applications.length)return `<tr><td colspan="${admin?6:5}"><div class="empty">No applications to show yet.</div></td></tr>`;return applications.map(application=>{const student=studentById(application.studentId),job=jobById(application.jobId);if(!student||!job)return '';return `<tr><td><span class="table-primary">${esc(student.name)}</span><span class="table-secondary">${esc(student.email)}</span></td><td><span class="table-primary">${esc(job.title)}</span><span class="table-secondary">${esc(job.company)}</span></td>${admin?`<td>${esc(student.qualification||'—')}</td>`:''}<td>${dateLabel(application.applied)}</td><td>${statusPill(application.status)}</td>${admin?`<td><button class="btn btn-light btn-sm" data-edit-application="${application.id}">Update</button></td>`:''}</tr>`}).join('')}
      function dashboardView(){const newApps=db.applications.filter(application=>application.status==='New').length;const openJobs=db.jobs.filter(job=>job.status==='Open').length;const recent=[...db.applications].sort((a,b)=>b.applied.localeCompare(a.applied)).slice(0,5);return `<div class="page"><div class="page-heading"><div><div class="eyebrow">Monday, ${dateLabel(today())}</div><h1>Good morning, Jordan</h1><p class="subhead">Here’s what’s happening across your talent network.</p></div><div class="heading-actions"><button class="btn btn-light" data-view="applications">View applications ↗</button><button class="btn btn-primary" data-modal="job">＋ Post a vacancy</button></div></div><div class="metrics">${metricCard('Open vacancies',openJobs,'Across '+db.clients.length+' client partners','▤')}${metricCard('Active candidates',db.students.length,'In your talent network','♙')}${metricCard('Applications',db.applications.length,'All-time submissions','↗')}${metricCard('Needs review',newApps,'New applications','◷')}</div><div class="overview-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Recent applications</div><div class="panel-sub">Latest candidate activity</div></div><button class="text-link" data-view="applications">All applications →</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Candidate</th><th>Position</th><th>Education</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody>${appTableRows(recent,true)}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Network activity</div><div class="panel-sub">A few recent milestones</div></div><span class="metric-icon">✳</span></div><div class="panel-body"><div class="activity-list">${recent.slice(0,4).map(application=>{const student=studentById(application.studentId),job=jobById(application.jobId);return `<div class="activity"><div class="activity-dot">↗</div><div><p><strong>${esc(student?.na       function clientsView(){const clients=db.clients.filter(client=>(client.name+' '+client.industry+' '+client.contact).toLowerCase().includes(query.toLowerCase()));return `<div class="page"><div class="page-heading"><div><div class="eyebrow">Relationships</div><h1>Client partners</h1><p class="subhead">Keep every hiring relationship thoughtful and organized.</p></div><div class="heading-actions"><button class="btn btn-primary" data-modal="client">＋ Add client</button></div></div><div class="toolbar"><div class="search"><input class="field" data-search placeholder="Search clients, industries or contacts" value="${esc(query)}"></div><span class="date-label">${clients.length} ${clients.length===1?'partner':'partners'}</span></div><div class="content-panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Client</th><th>Primary contact</th><th>Industry</th><th>Open roles</th><th>Status</th><th></th></tr></thead><tbody>${clients.length?clients.map(client=>`<tr><td><span class="table-primary">${esc(client.name)}</span><span class="table-secondary">${esc(client.email)}</span></td><td>${esc(client.contact)}<span class="table-secondary">${esc(client.phone||'')}</span></td><td>${esc(client.industry)}</td><td>${db.jobs.filter(job=>job.company===client.name&&job.status==='Open').length}</td><td>${statusPill(client.status)}</td><td><button class="btn btn-light btn-sm" data-edit-client="${client.id}">Edit</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No clients match your search.</div></td></tr>'}</tbody></table></div></div></div>`}
      function jobsView(){const admin=currentUser.role==='admin';const jobs=db.jobs.filter(job=>(admin||job.status==='Open')&&(job.title+' '+job.company+' '+job.location+' '+job.category).toLowerCase().includes(query.toLowerCase()));return `<div class="page"><div class="page-heading"><div><div class="eyebrow">${admin?'Hiring pipeline':'Find your next chapter'}</div><h1>${admin?'Vacancies':'Explore roles'}</h1><p class="subhead">${admin?'Manage open opportunities across your client network.':'Roles chosen for thoughtful people and ambitious teams.'}</p></div>${admin?`<div class="heading-actions"><button class="btn btn-primary" data-modal="job">＋ Post a vacancy</button></div>`:''}</div><div class="toolbar"><div class="search"><input class="field" data-search placeholder="Search roles, companies or locations" value="${esc(query)}"></div><select data-job-filter aria-label="Filter by status"><option>All statuses</option><option>Open</option><option>Paused</option><option>Closed</option></select><span class="date-label">${jobs.length} roles</span></div>${jobs.length?`<div class="job-grid">${jobs.filter(job=>!admin||statusFilter==='All statuses'||job.status===statusFilter).map(job=>{const applied=currentUser.role==='student'&&applicationsFor(currentUser.id).some(application=>application.jobId===job.id);return `<article class="job-card"><div class="job-card-head"><div><h2 class="job-title">${esc(job.title)}</h2><div class="company-line">${esc(job.company)} · ${esc(job.location)}</div></div><div class="company-mark">${initials(job.company)}</div></div>${admin?`<div style="margin-top:12px">${statusPill(job.status)}</div>`:''}<div class="job-tags"><span class="tag">${esc(job.type)}</span><span class="tag">${esc(job.category)}</span></div><p class="job-description">${esc(job.description)}</p><div class="job-foot"><span class="salary">${esc(job.salary)}</span><span>${admin?`<button class="btn btn-light btn-sm" data-edit-job="${job.id}">Edit</button>`:applied?`<span class="status">Applied</span>`:`<button class="btn btn-primary btn-sm" data-apply="${job.id}">Apply now →</button>`}</span></div></article>`}).join('')}</div>`:'<div class="content-panel"><div class="empty">No roles match those filters.</div></div>'}</div>`}
      function studentsView(){const students=db.students.filter(student=>(student.name+' '+student.email+' '+student.skills+' '+student.qualification).toLowerCase().includes(query.toLowerCase()));return `<div class="page"><div class="page-heading"><div><div class="eyebrow">Talent network</div><h1>Candidates</h1><p class="subhead">Profiles, skills and candidate accounts in one place.</p></div><div class="heading-actions"><button class="btn btn-primary" data-modal="student">＋ Add candidate</button></div></div><div class="toolbar"><div class="search"><input class="field" data-search placeholder="Search names, skills or qualifications" value="${esc(query)}"></div><span class="date-label">${students.length} candidates</span></div><div class="content-panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Candidate</th><th>Qualification</th><th>Experience</th><th>Skills</th><th>Applications</th><th></th></tr></thead><tbody>${students.length?students.map(student=>`<tr><td><span class="table-primary">${esc(student.name)}</span><span class="table-secondary">${esc(student.email)}</span></td><td>${esc(student.qualification||'—')}</td><td>${esc(student.experience||'—')}</td><td>${esc(student.skills||'—')}</td><td>${applicationsFor(student.id).length}</td><td><button class="btn btn-light btn-sm" data-edit-student="${student.id}">View profile</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">No candidates match your search.</div></td></tr>'}</tbody></table></div></div></div>`}
      function applicationsView(){const admin=currentUser.role==='admin';const apps=(admin?db.applications:applicationsFor(currentUser.id)).filter(application=>{const student=studentById(application.studentId),job=jobById(application.jobId);return (admin||!statusFilter||statusFilter==='All statuses'||application.status===statusFilter)&&(`${student?.name||''} ${job?.title||''} ${job?.company||''}`).toLowerCase().includes(query.toLowerCase())}).sort((a,b)=>b.applied.localeCompare(a.applied));return `<div class="page"><div class="page-heading"><div><div class="eyebrow">${admin?'Candidate pipeline':'Your progress'}</div><h1>${admin?'Applications':'My applications'}</h1><p class="subhead">${admin?'Review every application and keep candidates in the loop.':'Stay up to date as your applications move forward.'}</p></div></div><div class="toolbar"><div class="search"><input class="field" data-search placeholder="Search ${admin?'candidates or roles':'roles or companies'}" value="${esc(query)}"></div><select data-app-filter aria-label="Filter applications"><option>All statuses</option>${['New','In review','Interview','Offer','Rejected'].map(item=>`<option ${statusFilter===item?'selected':''}>${item}</option>`).join('')}</select><span class="date-label">${apps.length} applications</span></div><div class="content-panel"><div class="table-wrap"><table class="data-table"><thead><tr>${admin?'<th>Candidate</th>':'<th>Candidate</th>'}<th>Position</th>${admin?'<th>Education</th>':''}<th>Applied</th><th>Status</th>${admin?'<th></th>':''}</tr></thead><tbody>${appTableRows(apps,admin)}</tbody></table></div></div></div>`}
      function profileView(){const student=db.students.find(item=>item.id===currentUser.id)||currentUser;const filled=['name','email','phone','location','qualification','experience','skills','resume','about'].filter(key=>student[key]?.trim()).length;const percent=Math.round(filled/9*100);return `<div class="page"><div class="page-heading"><div><div class="eyebrow">Your details, your story</div><h1>My profile</h1><p class="subhead">A little more about you helps us make a better match.</p></div><div class="heading-actions"><button class="btn btn-primary" data-save-profile>Save changes</button></div></div><div class="profile-layout"><form id="profile-form" class="content-panel"><div class="form-section"><div class="form-title">Personal information</div><div class="form-grid">${field('Full name','name',student.name)}${field('Email address','email',student.email,'email')}${field('Phone number','phone',student.phone)}${field('Location','location',student.location)}</div></div><div class="form-section"><div class="form-title">Your experience</div><div class="form-grid">${field('Qualification','qualification',student.qualification)}${field('Years of experience','experience',student.experience)}${field('Skills','skills',student.skills,'text','full','Separate skills with commas')}${field('A short introduction','about',student.about,'textarea','full')}</div></div><div class="form-section"><div class="form-title">Resume</div><div class="form-grid">${field('Resume URL','resume',student.resume,'url','full','https://…')}</div></div></form><aside class="panel profile-card"><div class="profile-avatar">${initials(student.name)}</div><h3>${esc(student.name)}</h3><p>${esc(student.location||'Add your location')}</p><div class="detail-label">PROFILE COMPLETENESS</div><div class="profile-progress"><span style="width:${percent}%"></span></div><div class="detail-line"><span>${percent}% complete</span><span>${filled}/9 fields</span></div><div class="detail-line"><span>Applications</span><b>${applicationsFor(student.id).length}</b></div><div class="detail-line"><span>Resume</span><b>${student.resume?'Added':'Missing'}</b></div></aside></div></div>`}
      function field(label,name,value,type='text',size='',placeholder=''){if(type==='textarea')return `<div class="form-field ${size}"><label for="field-${name}">${label}</label><textarea class="field" id="field-${name}" name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;return `<div class="form-field ${size}"><label for="field-${name}">${label}</label><input class="field" id="field-${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
      function render(){if(!currentUser){loginScreen();return}const views={dashboard:dashboardView,clients:clientsView,jobs:jobsView,students:studentsView,applications:applicationsView,profile:profileView};if(currentUser.role==='student'&&currentView==='dashboard')currentView='jobs';if(currentUser.role==='admin'&&currentView==='profile')currentView='dashboard';document.getElementById('app').innerHTML=`<div class="shell">${navigation()}<main class="main"><header class="topbar"><div class="crumb">Fieldwork &nbsp;/&nbsp; <strong>${({dashboard:'Overview',clients:'Clients',jobs:currentUser.role==='admin'?'Vacancies':'Explore jobs',students:'Candidates',applications:'Applications',profile:'My profile'})[currentView]||'Overview'}</strong></div><div class="top-actions"><span class="date-label">${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span><button class="icon-button" data-view="${currentUser.role==='admin'?'applications':'profile'}" aria-label="Open ${currentUser.role==='admin'?'applications':'profile'}">${currentUser.role==='admin'?'↗':'♙'}</button></div></header>${(views[currentView]||dashboardView)()}</main></div>`;bindEvents()}
      function bindEvents(){applyBrand();document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{currentView=button.dataset.view;query='';statusFilter='All statuses';render()}));document.querySelector('[data-logout]')?.addEventListener('click',()=>{currentUser=null;query='';currentView='dashboard';render()});document.querySelector('[data-search]')?.addEventListener('input',event=>{query=event.target.value;const cursor=event.target.selectionStart;render();const input=document.querySelector('[data-search]');input?.focus();input?.setSelectionRange(cursor,cursor)});document.querySelector('[data-job-filter]')?.addEventListener('change',event=>{statusFilter=event.target.value;render()});document.querySelector('[data-app-filter]')?.addEventListener('change',event=>{statusFilter=event.target.value;render()});document.querySelectorAll('[data-modal]').forEach(button=>button.addEventListener('click',()=>openModal(button.dataset.modal)));document.querySelectorAll('[data-edit-client]').forEach(button=>button.addEventListener('click',()=>openModal('client',button.dataset.editClient)));document.querySelectorAll('[data-edit-job]').forEach(button=>button.addEventListener('click',()=>openModal('job',button.dataset.editJob)));document.querySelectorAll('[data-edit-student]').forEach(button=>button.addEventListener('click',()=>openModal('student',button.dataset.editStudent)));document.querySelectorAll('[data-edit-application]').forEach(button=>button.addEventListener('click',()=>openModal('application',button.dataset.editApplication)));document.querySelectorAll('[data-apply]').forEach(button=>button.addEventListener('click',()=>applyForJob(button.dataset.apply)));document.querySelector('[data-save-profile]')?.addEventListener('click',saveProfile);document.querySelector('[data-support]')?.addEventListener('click',()=>toast('Email us at hello@fieldworktalent.test'))}
      function openModal(type,id){const existing=type==='client'?db.clients.find(item=>item.id===id):type==='job'?db.jobs.find(item=>item.id===id):type==='student'?db.students.find(item=>item.id===id):db.applications.find(item=>item.id===id);let title='',description='',fields='',saveLabel=existing?'Save changes':'Create';if(type==='client'){title=existing?'Edit client':'Add a client';description='Keep your hiring partner details up to date.';fields=field('Company name','name',existing?.name||'')+field('Industry','industry',existing?.industry||'')+field('Primary contact','contact',existing?.contact||'')+field('Contact email','email',existing?.email||'','email')+field('Phone number','phone',existing?.phone||'')+`<div class="form-field"><label for="field-status">Status</label><select class="field" id="field-status" name="status"><option ${existing?.status==='Active'?'selected':''}>Active</option><option ${existing?.status==='Paused'?'selected':''}>Paused</option></select></div>`}
        if(type==='job'){title=existing?'Edit vacancy':'Post a vacancy';description='Clear roles help the right candidates picture the work.';fields=field('Role title','title',existing?.title||'')+field('Client','company',existing?.company||'')+field('Location','location',existing?.location||'')+`<div class="form-field"><label for="field-type">Employment type</label><select class="field" id="field-type" name="type">${['Full-time','Part-time','Contract','Temporary'].map(value=>`<option ${existing?.type===value?'selected':''}>${value}</option>`).join('')}</select></div>`+field('Salary range','salary',existing?.salary||'')+field('Category','category',existing?.category||'')+field('Role description','description',existing?.description||'','textarea','full')+`<div class="form-field"><label for="field-status">Status</label><select class="field" id="field-status" name="status">${['Open','Paused','Closed'].map(value=>`<option ${existing?.status===value?'selected':''}>${value}</option>`).join('')}</select></div>`}
        if(type==='student'){title=existing?'Candidate profile':'Add a candidate';description=existing?'Candidate details and account access.':'Create a profile and student portal login.';fields=field('Full name','name',existing?.name||'')+field('Email address','email',existing?.email||'','email')+field('Phone number','phone',existing?.phone||'')+field('Location','location',existing?.location||'')+field('Qualification','qualification',existing?.qualification||'')+field('Experience','experience',existing?.experience||'')+field('Skills','skills',existing?.skills||'','text','full')+field('Resume URL','resume',existing?.resume||'','url','full')+field('Temporary password','password',existing?.password||'student123','text','full','Share this with the candidate')}
        if(type==='application'){const app=existing,student=studentById(app.studentId),job=jobById(app.jobId);title='Update application';description=`${student?.name||'Candidate'} · ${job?.title||'Role'}`;fields=`<div class="form-field"><label for="field-status">Application status</label><select class="field" id="field-status" name="status">${['New','In review','Interview','Offer','Rejected'].map(value=>`<option ${app.status===value?'selected':''}>${value}</option>`).join('')}</select></div>`+field('Note for your team','note',app.note||'','textarea','full','Optional internal note')}
        document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${description}</p></div><button class="modal-close" data-close aria-label="Close dialog">×</button></div><form id="modal-form"><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><button type="button" class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" type="submit">${saveLabel}</button></div></form></section></div>`);
        const backdrop=document.querySelector('[data-backdrop]');backdrop.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>backdrop.remove()));backdrop.addEventListener('click',event=>{if(event.target===backdrop)backdrop.remove()});backdrop.querySelector('#modal-form').addEventListener('submit',event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target).entries());if(type==='client'){if(!data.name.trim()||!data.email.trim())return;if(existing)Object.assign(existing,data);else db.clients.push({id:crypto.randomUUID(),...data})}if(type==='job'){if(!data.title.trim()||!data.company.trim())return;if(!db.clients.some(client=>client.name.toLowerCase()===data.company.trim().toLowerCase()))db.clients.push({id:crypto.randomUUID(),name:data.company.trim(),industry:'New partner',contact:'',email:'',phone:'',status:'Active'});if(existing)Object.assign(existing,data);else db.jobs.push({id:crypto.randomUUID(),...data,created:today()})}if(type==='student'){if(!data.name.trim()||!data.email.trim())return;if(existing){Object.assign(existing,data);if(currentUser.id===existing.id)currentUser={role:'student',...existing}}else{if(db.students.some(student=>student.email.toLowerCase()===data.email.toLowerCase())){toast('A candidate account already uses that email.');return}db.students.push({id:crypto.randomUUID(),...data,joined:today(),about:''})}}if(type==='application'){existing.status=data.status;existing.note=data.note}persist();backdrop.remove();render();toast(type==='student'&&!existing?'Candidate login created':`${title.replace(/^(Add a |Edit |Post a |Update )/,'')} saved`)})}
      function applyForJob(jobId){if(db.applications.some(application=>application.studentId===currentUser.id&&application.jobId===jobId)){toast('You have already applied for this role.');return}db.applications.push({id:crypto.randomUUID(),studentId:currentUser.id,jobId,status:'New',applied:today(),note:''});persist();render();toast('Application sent. You can follow its progress in My applications.')}
      function saveProfile(){const form=document.getElementById('profile-form');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form).entries());const student=db.students.find(item=>item.id===currentUser.id);if(db.students.some(item=>item.id!==student.id&&item.email.toLowerCase()===data.email.toLowerCase())){toast('That email is already associated with another account.');return}Object.assign(student,data);currentUser={role:'student',...student};persist();render();toast('Profile updated.')}
      render();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase/config.js"></script>
  <script src="app.js"></script>
</body>
